<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Tsu-App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/favicon.ico">
  <style>
    body {
      margin: 0;
      background: #f5f7fa;
      color: #333;
      font-family: "Yu Gothic UI", sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }

    .card {
      background: #fceff1; /* 優しい淡ピンク */
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
      color: #1f2937;
      letter-spacing: 0.04em;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .lead {
      font-size: 16px;
      line-height: 1.8;
      color: #555;
      margin-top: 100px;
      margin-bottom: 100px;
    }

    .button {
      display: inline-block;
      padding: 14px 32px;
      background: #e979a9; /* アクセントピンク */
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .button:hover {
      background: #ce538d; /* 少し濃いピンク */
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>
        <img height="60" width="60" src="App/_Pic/_Tsuru.svg" alt="Tsu-App">
      <span>Tsu-App</span>  
      </h1>

      <p class="lead">
        Tsu-App へようこそ<br>
      </p>

      <a class="button" href="App/">
        アプリ一覧
      </a>
    </section>

    <div class="footer">
      Copyright © Tsu-App. All rights reserved.
    </div>
  </main>
</body>
</html>
